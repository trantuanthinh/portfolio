        function copyToClipboard(value, button) {
            navigator.clipboard

                .then(() => {
                    const originalText = button.textContent;
                    button.textContent = "Copied!";
                    button.classList.add("copied");
                    setTimeout(() => {

        const canvas = document.getElementById("starfield-canvas");
        const ctx = canvas.getContext("2d");
        let width, height;
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            const dpr = window.devicePixelRatio || 1;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);
            canvas.style.width = `${ width }px`;
            canvas.style.height = `${ height }px`;
        }
        window.addEventListener("resize", resize);
        resize();

        const stars = Array.from({ length: 120 }, () => ({
            x: Math.random() * width,
            y: Math.random() * height,
            size: Math.random() * 1.5 + 0.5,
            speedX: (Math.random() - 0.5) * 0.2,
            speedY: (Math.random() - 0.5) * 0.2,
        }));

        let ripples = [];
        window.addEventListener("click", (e) => {
            if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
            if (e.target.closest("button") || e.target.closest("a")) return;
            ripples.push({ x: e.clientX, y: e.clientY, startTime: Date.now() });
        });

        function animate() {
            ctx.clearRect(0, 0, width, height);
            const isDark = root.classList.contains("dark");
            const [r, g, b] = isDark ? [52, 211, 153] : [6, 95, 70];
            const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

            stars.forEach((s) => {
                if (!reduceMotion) {
                    s.x = (s.x + s.speedX + width) % width;
                    s.y = (s.y + s.speedY + height) % height;
                }
                const dist = Math.hypot(s.x - mouse.x, s.y - mouse.y);
                const influence = Math.max(0, 1 - dist / 180);
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size + influence * 2, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${ r }, ${ g }, ${ b }, ${ isDark ? 0.25 + influence * 0.55 : 0.15 + influence * 0.45 })`;
                ctx.fill();
            });

            if (!reduceMotion) {
                ripples = ripples.filter((rpl) => {
                    const age = (Date.now() - rpl.startTime) / 1000;
                    if (age > 1.2) return false;
                    ctx.beginPath();
                    ctx.strokeStyle = `rgba(${ r }, ${ g }, ${ b }, ${ 0.4 * (1 - age / 1.2) })`;
                    ctx.lineWidth = 1.5;
                    ctx.arc(rpl.x, rpl.y, age * 150, 0, Math.PI * 2);
                    ctx.stroke();
                    return true;
                });
            }
            requestAnimationFrame(animate);
        }
        animate();

        const sections = document.querySelectorAll(".content-section");
        const navItems = document.querySelectorAll(".section-nav .nav-item");
        const projectItems = document.querySelectorAll(".pe-item");
        const subnavItems = document.querySelectorAll(".section-nav .subnav-item");

        const observerOptions = {
            root: null,
            rootMargin: "-20% 0px -60% 0px",
            threshold: 0,
        };

        const activeSectionObserver = new IntersectionObserver((entries) => {
            entries.forEach((entry) => {
                if (entry.isIntersecting) {
                    const targetId = entry.target.getAttribute("id");
                    navItems.forEach((item) => {
                        if (item.getAttribute("data-target") === targetId) {
                            item.classList.add("active");
                        } else {
                            item.classList.remove("active");
                        }
                    });
                }
            });
        }, observerOptions);

        sections.forEach((section) => {
            activeSectionObserver.observe(section);
            const entranceObserver = new IntersectionObserver(
                (entries, obs) => {
                    entries.forEach((entry) => {
                        if (entry.isIntersecting) {
                            entry.target.classList.add("visible");
                            obs.unobserve(entry.target);
                        }
                    });
                },
                { threshold: 0.1, rootMargin: "0px 0px -10% 0px" },
            );
            entranceObserver.observe(section);
        });

        const projectObserverOptions = {
            root: null,
            rootMargin: "-10% 0px -50% 0px",
            threshold: 0,
        };

        const activeProjectObserver = new IntersectionObserver((entries) => {
            entries.forEach((entry) => {
                if (entry.isIntersecting) {
                    const projectId = entry.target.getAttribute("id");
                    subnavItems.forEach((subItem) => {
                        if (subItem.getAttribute("data-target") === projectId) {
                            subItem.classList.add("active");
                        } else {
                            subItem.classList.remove("active");
                        }
                    });
                }
            });
        }, projectObserverOptions);

        projectItems.forEach((project) => {
            activeProjectObserver.observe(project);
        });

        window.addEventListener(
            "scroll",
            () => {
                const scrollY = window.scrollY;
                document
                    .getElementById("compact-header")
                    .classList.toggle("visible", scrollY > window.innerHeight * 0.4);
                document.getElementById("scroll-top").classList.toggle("visible", scrollY > 500);
            },
            { passive: true },
        );

        document.getElementById("scroll-top").addEventListener("click", () => {
            window.scrollTo({ top: 0, behavior: "smooth" });
        });

        document.querySelectorAll('.section-nav .subnav-item').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                const targetId = this.getAttribute('href');
                if (targetId && targetId.startsWith('#') && targetId.length > 1) {
                    const targetElement = document.querySelector(targetId);
                    if (targetElement) {
                        e.preventDefault();

                        const headerOffset = 90;
                        const elementPosition = targetElement.getBoundingClientRect().top;
                        const offsetPosition = elementPosition + window.pageYOffset - headerOffset;

                        window.scrollTo({
                            top: offsetPosition,
                            behavior: 'smooth'
                        });

                        history.pushState(null, null, targetId);
                    }
                }
            });
        });
    </script>
</body>

</html>
