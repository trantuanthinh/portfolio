<!doctype html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trần Tuấn Thịnh — Software Engineer</title>
    <meta name="description" content="Portfolio of Trần Tuấn Thịnh, Full-stack Software Engineer." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Roboto:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />

    <link rel="stylesheet" href="portfolio.css" />
</head>

<body>
    <div id="intro-screen" class="intro-screen">
        <div class="shutter-left"></div>
        <div class="shutter-right"></div>
        <div class="intro-center">
            <div class="intro-core">
                <div class="cyber-ring"></div>
                <div class="cyber-ring-inner"></div>
            </div>
            <div class="intro-text-group">
                <span class="intro-name">trantuanthinh</span>
                <span class="intro-role">Software Engineer</span>
            </div>
        </div>
    </div>

    <canvas id="starfield-canvas"></canvas>
    <nav class="section-nav" id="section-nav" aria-label="Section Navigation">
        <ul id="main-nav-list"></ul>
    </nav>
    <header class="compact-header" id="compact-header">
        <div class="compact-brand">
            <span class="brand-initials">TT</span><span class="brand-name" id="header-brand-name"></span>
        </div>
        <div class="compact-nav-right">
            <div class="compact-clock-badge" id="compact-clock">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" style="color: var(--accent)">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polyline points="12 6 12 12 16 14"></polyline>
                </svg>
                <span id="clock-date">Mon, Mar 9, 2026</span>
                <span>•</span>
                <span id="clock-time">00:00:00</span>
            </div>
            <div class="header-contact-dropdown">
                <button type="button" class="header-contact-trigger" id="header-contact-trigger" aria-expanded="false"
                    aria-label="Toggle contact info">
                    <span>Contact Info</span><svg width="12" height="12" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                </button>
                <div class="header-contact-popover" id="header-contact-popover"></div>
            </div>
            <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle theme">
                <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg><svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
            </button>
        </div>
    </header>
    <main class="main-container">
        <section id="about" class="content-section header-info-section" data-num="01" data-title="ABOUT">
            <div class="hero-content">
                <div class="hero-badge"><span class="status-dot"></span><span id="hero-status"></span></div>
                <h1 class="hero-title" id="hero-title"></h1>
                <p class="hero-subtitle" id="hero-subtitle"></p>
                <p class="hero-tagline" id="hero-tagline"></p>
                <div class="hero-contact-card" id="hero-contact-card"></div>
            </div>
        </section>
        <section id="projects" class="content-section section" data-num="02" data-title="PROJECTS & EXPERIENCE">
            <div class="section-header">
                <span class="section-number">02</span>
                <h2 class="section-heading">Projects & Experience</h2>
            </div>
            <div class="projects-grid" id="projects-grid"></div>
        </section>
        <section id="skills" class="content-section section" data-num="03" data-title="SKILLS">
            <div class="section-header">
                <span class="section-number">03</span>
                <h2 class="section-heading">Skills</h2>
            </div>
            <div class="skills-grid" id="skills-grid"></div>
        </section>
        <section id="education" class="content-section section" data-num="04" data-title="EDUCATION">
            <div class="section-header">
                <span class="section-number">04</span>
                <h2 class="section-heading">Education</h2>
            </div>
            <div class="education-stack" id="education-stack"></div>
        </section>
        <footer class="site-footer">
            <p>© <span id="current-year"></span> Trần Tuấn Thịnh. All rights reserved.</p>
        </footer>
    </main>
    <button id="scroll-top" class="scroll-to-top" aria-label="Scroll to top">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round">
            <polyline points="18 15 12 9 6 15"></polyline>
        </svg>
    </button>

    <script src="portfolioData.js"></script>
    <script src="portfolio.js"></script>
    <script>
        // Initialize portfolio rendering on load
        renderPortfolio();

        // Initialize theme management from local storage
        const root = document.documentElement;
        const savedTheme = localStorage.getItem("theme") || "dark";
        root.className = savedTheme;

        document.getElementById("theme-toggle").addEventListener("click", () => {
            const newTheme = root.classList.contains("dark") ? "light" : "dark";
            root.className = newTheme;
            localStorage.setItem("theme", newTheme);
        });

        // Toggle Pdf Preview utility
        function togglePdfPreview(projectId, btnElement) {
            const container = document.getElementById(`pdf-container-${ projectId }`);
            const iframe = container.querySelector("iframe");
            const isHidden = container.style.display === "none";

            if (isHidden) {
                if (!iframe.getAttribute("src") && iframe.getAttribute("data-src")) {
                    iframe.setAttribute("src", iframe.getAttribute("data-src"));
                }
                container.style.display = "block";
                if (btnElement) btnElement.style.display = "none";
            } else {
                container.style.display = "none";
                const parentWrapper = container.closest(".pe-pdf-preview-wrapper");
                const previewBtn = parentWrapper.querySelector(".pdf-preview-btn");
                if (previewBtn) previewBtn.style.display = "inline-flex";
            }
        }

        // Copy text utility function with feedback state
        function copyToClipboard(value, button) {
            navigator.clipboard
                .writeText(value)
                .then(() => {
                    const originalText = button.textContent;
                    button.textContent = "Copied!";
                    button.classList.add("copied");
                    setTimeout(() => {
                        button.textContent = originalText;
                        button.classList.remove("copied");
                    }, 2000);
                })
                .catch((err) => {
                    console.error("Failed to copy text: ", err);
                });
        }

        // Handle contact popover dropdown open/close toggle
        const contactTrigger = document.getElementById("header-contact-trigger");
        const contactPopover = document.getElementById("header-contact-popover");

        contactTrigger.addEventListener("click", (e) => {
            e.stopPropagation();
            const isOpen = contactPopover.classList.toggle("show");
            contactTrigger.setAttribute("aria-expanded", isOpen);
        });

        window.addEventListener("click", (e) => {
            if (!e.target.closest(".header-contact-dropdown")) {
                contactPopover.classList.remove("show");
                contactTrigger.setAttribute("aria-expanded", "false");
            }
        });

        // Track mouse coordinates globally for canvas animations
        const mouse = { x: -1000, y: -1000 };
        window.addEventListener("pointermove", (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        // Setup starfield background canvas animation and resizing
        const canvas = document.getElementById("starfield-canvas");
        const ctx = canvas.getContext("2d");
        let width, height;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            const dpr = window.devicePixelRatio || 1;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);
            canvas.style.width = `${ width }px`;
            canvas.style.height = `${ height }px`;
        }

        window.addEventListener("resize", resize);
        resize();

        // Initialize star objects array
        const stars = Array.from({ length: 120 }, () => ({
            x: Math.random() * width,
            y: Math.random() * height,
            size: Math.random() * 1.5 + 0.5,
            speedX: (Math.random() - 0.5) * 0.2,
            speedY: (Math.random() - 0.5) * 0.2,
        }));

        // Handle click ripple effects on canvas background
        let ripples = [];
        window.addEventListener("click", (e) => {
            if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
            if (e.target.closest("button") || e.target.closest("a")) return;
            ripples.push({ x: e.clientX, y: e.clientY, startTime: Date.now() });
        });

        // Main animation loop for stars and interactive ripples
        function animate() {
            ctx.clearRect(0, 0, width, height);
            const isDark = root.classList.contains("dark");
            const [r, g, b] = isDark ? [52, 211, 153] : [6, 95, 70];
            const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

            stars.forEach((s) => {
                if (!reduceMotion) {
                    s.x = (s.x + s.speedX + width) % width;
                    s.y = (s.y + s.speedY + height) % height;
                }
                const dist = Math.hypot(s.x - mouse.x, s.y - mouse.y);
                const influence = Math.max(0, 1 - dist / 180);
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size + influence * 2, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${ r }, ${ g }, ${ b }, ${ isDark ? 0.25 + influence * 0.55 : 0.15 + influence * 0.45 })`;
                ctx.fill();
            });

            if (!reduceMotion) {
                ripples = ripples.filter((rpl) => {
                    const age = (Date.now() - rpl.startTime) / 1000;
                    if (age > 1.2) return false;
                    ctx.beginPath();
                    ctx.strokeStyle = `rgba(${ r }, ${ g }, ${ b }, ${ 0.4 * (1 - age / 1.2) })`;
                    ctx.lineWidth = 1.5;
                    ctx.arc(rpl.x, rpl.y, age * 150, 0, Math.PI * 2);
                    ctx.stroke();
                    return true;
                });
            }
            requestAnimationFrame(animate);
        }
        animate();

        // Intersection observers for section highlighting and entrance animations
        const sections = document.querySelectorAll(".content-section");
        const navItems = document.querySelectorAll(".section-nav .nav-item");
        const projectItems = document.querySelectorAll(".pe-item");
        const subnavItems = document.querySelectorAll(".section-nav .subnav-item");

        const observerOptions = {
            root: null,
            rootMargin: "-20% 0px -60% 0px",
            threshold: 0,
        };

        const activeSectionObserver = new IntersectionObserver((entries) => {
            entries.forEach((entry) => {
                if (entry.isIntersecting) {
                    const targetId = entry.target.getAttribute("id");
                    navItems.forEach((item) => {
                        if (item.getAttribute("data-target") === targetId) {
                            item.classList.add("active");
                        } else {
                            item.classList.remove("active");
                        }
                    });
                }
            });
        }, observerOptions);

        sections.forEach((section) => {
            activeSectionObserver.observe(section);
            const entranceObserver = new IntersectionObserver(
                (entries, obs) => {
                    entries.forEach((entry) => {
                        if (entry.isIntersecting) {
                            entry.target.classList.add("visible");
                            obs.unobserve(entry.target);
                        }
                    });
                },
                { threshold: 0.1, rootMargin: "0px 0px -10% 0px" },
            );
            entranceObserver.observe(section);
        });

        const projectObserverOptions = {
            root: null,
            rootMargin: "-10% 0px -50% 0px",
            threshold: 0,
        };

        const activeProjectObserver = new IntersectionObserver((entries) => {
            entries.forEach((entry) => {
                if (entry.isIntersecting) {
                    const projectId = entry.target.getAttribute("id");
                    subnavItems.forEach((subItem) => {
                        if (subItem.getAttribute("data-target") === projectId) {
                            subItem.classList.add("active");
                        } else {
                            subItem.classList.remove("active");
                        }
                    });
                }
            });
        }, projectObserverOptions);

        projectItems.forEach((project) => {
            activeProjectObserver.observe(project);
        });

        // Update real-time clock display
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, "0");
            const minutes = String(now.getMinutes()).padStart(2, "0");
            const seconds = String(now.getSeconds()).padStart(2, "0");

            const weekdays = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
            const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

            const weekday = weekdays[now.getDay()];
            const month = months[now.getMonth()];
            const day = now.getDate();
            const year = now.getFullYear();

            const clockEl = document.getElementById("clock-time");
            if (clockEl) clockEl.textContent = `${ hours }:${ minutes }:${ seconds }`;

            const dateEl = document.getElementById("clock-date");
            if (dateEl) dateEl.textContent = `${ weekday }, ${ month } ${ day }, ${ year }`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Handle window scroll behavior for compact header and scroll-to-top button
        window.addEventListener(
            "scroll",
            () => {
                const scrollY = window.scrollY;
                document
                    .getElementById("compact-header")
                    .classList.toggle("visible", scrollY > window.innerHeight * 0.4);
                document.getElementById("scroll-top").classList.toggle("visible", scrollY > 500);
            },
            { passive: true },
        );

        // Set footer copyright year and scroll-to-top trigger action
        document.getElementById("current-year").textContent = new Date().getFullYear();
        document.getElementById("scroll-top").addEventListener("click", () => {
            window.scrollTo({ top: 0, behavior: "smooth" });
        });

        // Handle smooth scrolling and history state updates for subnav links
        document.querySelectorAll(".section-nav .subnav-item").forEach((anchor) => {
            anchor.addEventListener("click", function (e) {
                const targetId = this.getAttribute("href");
                if (targetId && targetId.startsWith("#") && targetId.length > 1) {
                    const targetElement = document.querySelector(targetId);
                    if (targetElement) {
                        e.preventDefault();
                        const headerOffset = 90;
                        const elementPosition = targetElement.getBoundingClientRect().top;
                        const offsetPosition = elementPosition + window.pageYOffset - headerOffset;

                        window.scrollTo({ top: offsetPosition, behavior: "smooth" });
                        history.pushState(null, null, targetId);
                    }
                }
            });
        });

        // Fade out and remove loading intro screen on window load
        window.addEventListener("load", () => {
            setTimeout(() => {
                const introScreen = document.getElementById("intro-screen");
                if (introScreen) {
                    introScreen.classList.add("active");
                    setTimeout(() => introScreen.remove(), 850);
                }
            }, 800);
        });
    </script>
</body>

</html>
