<!doctype html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trần Tuấn Thịnh — Software Engineer</title>
    <meta name="description" content="Portfolio of Trần Tuấn Thịnh, Full-stack Software Engineer." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Roboto:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />

    <link rel="stylesheet" href="style.min.css" />
</head>

<body>
    <div id="intro-screen" class="intro-screen">
        <div class="shutter-left"></div>
        <div class="shutter-right"></div>
        <div class="intro-center">
            <div class="intro-core">
                <div class="cyber-ring"></div>
                <div class="cyber-ring-inner"></div>
            </div>
            <div class="intro-text-group">
                <span class="intro-name">trantuanthinh</span>
                <span class="intro-role">Software Engineer</span>
            </div>
        </div>
    </div>

    <canvas id="starfield-canvas"></canvas>
    <nav class="section-nav" id="section-nav" aria-label="Section Navigation">
        <ul id="main-nav-list"></ul>
    </nav>
    <header class="compact-header" id="compact-header">
        <div class="compact-brand">
            <span class="brand-initials">TT</span><span class="brand-name" id="header-brand-name"></span>
        </div>
        <div class="compact-nav-right">
            <div class="compact-clock-badge" id="compact-clock">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" style="color: var(--accent)">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polyline points="12 6 12 12 16 14"></polyline>
                </svg>
                <span id="clock-date">Mon, Mar 9, 2026</span>
                <span>•</span>
                <span id="clock-time">00:00:00</span>
            </div>
            <div class="header-contact-dropdown">
                <button type="button" class="header-contact-trigger" id="header-contact-trigger" aria-expanded="false"
                    aria-label="Toggle contact info">
                    <span>Contact Info</span><svg width="12" height="12" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                </button>
                <div class="header-contact-popover" id="header-contact-popover"></div>
            </div>
            <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle theme">
                <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg><svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
            </button>
        </div>
    </header>
    <main class="main-container">
        <section id="about" class="content-section header-info-section" data-num="01" data-title="ABOUT">
            <div class="hero-content">
                <div class="hero-badge"><span class="status-dot"></span><span id="hero-status"></span></div>
                <h1 class="hero-title" id="hero-title"></h1>
                <p class="hero-subtitle" id="hero-subtitle"></p>
                <p class="hero-tagline" id="hero-tagline"></p>
                <div class="hero-contact-card" id="hero-contact-card"></div>
            </div>
        </section>
        <section id="projects" class="content-section section" data-num="02" data-title="PROJECTS & EXPERIENCE">
            <div class="section-header">
                <span class="section-number">02</span>
                <h2 class="section-heading">Projects & Experience</h2>
            </div>
            <div class="projects-grid" id="projects-grid"></div>
        </section>
        <section id="skills" class="content-section section" data-num="03" data-title="SKILLS">
            <div class="section-header">
                <span class="section-number">03</span>
                <h2 class="section-heading">Skills</h2>
            </div>
            <div class="skills-grid" id="skills-grid"></div>
        </section>
        <section id="education" class="content-section section" data-num="04" data-title="EDUCATION">
            <div class="section-header">
                <span class="section-number">04</span>
                <h2 class="section-heading">Education</h2>
            </div>
            <div class="education-stack" id="education-stack"></div>
        </section>
        <footer class="site-footer">
            <p>© <span id="current-year"></span> Trần Tuấn Thịnh. All rights reserved.</p>
        </footer>
    </main>
    <button id="scroll-top" class="scroll-to-top" aria-label="Scroll to top">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round">
            <polyline points="18 15 12 9 6 15"></polyline>
        </svg>
    </button>

    <script src="portfolioData.min.js"></script>
    <script src="portfolio.min.js"></script>
    <script src="main.min.js"></script>
</body>

</html>
